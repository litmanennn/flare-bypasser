name: Docker

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

on:
  push:
    branches:
      - "main"
    tags:
      - "v*.*.*"

  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - builder: ubuntu-latest
            platform: linux/arm64

    runs-on: ${{ matrix.builder }}

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cosign
        uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20
        with:
          cosign-release: "v2.2.4"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs:
      - build

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
            type=ref,enable=true,priority=600,prefix=,suffix=,event=tag
            type=ref,enable=true,priority=600,prefix=,suffix=,event=branch
          labels: |
            org.opencontainers.image.title=flare-bypasser
            org.opencontainers.image.description=Flare Bypass Server
            org.opencontainers.image.vendor=yuri.kuznecov@gmail.com

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t ${{ env.REGISTRY }}/" + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          set -e
          set -o pipefail

          echo "${{ steps.meta.outputs.tags }}" \
            | sed -r 's/[ ]+/ /g' \
            | tr ' ' '\n' \
            | sed -r 's|^|${{ env.REGISTRY }}/|' \
            | while read IMAGE_NAME ; do
                docker buildx imagetools inspect "$IMAGE_NAME" || exit 1
              done

          echo "${{ steps.meta.outputs.tags }}" \
            | sed -r 's/[ ]+/ /g' \
            | tr ' ' '\n' \
            | sed -r 's|^|${{ env.REGISTRY }}/|' \
            | head -n1 > /tmp/image_to_test_run

          echo "===== /tmp/image_to_test_run ====="
          cat /tmp/image_to_test_run

      - name: Upload image to test
        uses: actions/upload-artifact@v4
        with:
          name: image_to_test_run
          path: /tmp/image_to_test_run
          if-no-files-found: error
          retention-days: 1

  image-test-run:
    needs:
      - merge

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download image information
        uses: actions/download-artifact@v4
        with:
          name: image_to_test_run
          path: /tmp/

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Test ARM64 image
        run: |
          set -e
          set -o pipefail

          IMAGE_NAME_TO_TEST=$(cat /tmp/image_to_test_run)

          echo "To test image: $IMAGE_NAME_TO_TEST"

          CONTAINER_ID=$(docker container run \
            --platform linux/arm64 \
            -d \
            -p 20080:8191 \
            "$IMAGE_NAME_TO_TEST")

          echo "Container ID: $CONTAINER_ID"

          echo "Waiting for FlareBypasser to start..."
          sleep 15

          echo "===== docker ps ====="
          docker ps

          echo "===== container logs ====="
          docker logs "$CONTAINER_ID"

          echo "===== running tests ====="
          bash ./tests/server_tests/sites_test.sh

          echo "===== stopping test container ====="
          docker stop "$CONTAINER_ID"
          docker rm "$CONTAINER_ID"